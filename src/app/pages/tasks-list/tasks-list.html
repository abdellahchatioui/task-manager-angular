
<div>
    <app-tasks-create (taskAdded)="addTask($event)"></app-tasks-create>
</div>

<div>
    @for (task of tasks(); track $index) {
        <li>{{$index+1}}</li>
        <app-task-card [task]="task" (taskDelete)="deleteTask($event)"></app-task-card>
        <button [routerLink]="['/task/edit' , task.id]" >edit</button>
    }@empty {
        <li>Task Empty !!</li>
    }
</div>

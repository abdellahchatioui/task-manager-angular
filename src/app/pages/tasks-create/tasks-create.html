<p>tasks-create works!</p>

<form [formGroup]="taskForm" (ngSubmit)="submit()">
    <input type="text" formControlName="title" placeholder="Task Title">

    <label>
        <input type="checkbox" formControlName="completed" >
        Completed
    </label>

    <button type="submit" [disabled]="taskForm.invalid">Add Task</button>
</form>
